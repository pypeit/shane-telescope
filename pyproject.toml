[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shane-telescope"
version = "0.1.0"
description = "Testing IOP (inherent optical properties) algorithms with Shane telescope data"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "PypeIt Collaboration"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "astropy>=5.0",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "isort>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
